services:
  postgres:
    image: postgres:16
    container_name: saicc-postgres
    environment:
      POSTGRES_USER: saicc
      POSTGRES_PASSWORD: saicc_dev_password
      POSTGRES_DB: saicc
    ports:
      - "${SAICC_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saicc -d saicc"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - saicc-postgres:/var/lib/postgresql/data
volumes:
  saicc-postgres:
